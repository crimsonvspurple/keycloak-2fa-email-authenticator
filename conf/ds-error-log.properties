# Reviewer log for DobberSports Keycloak. Stdout stays on the console handler.
# This named handler is not attached to the root logger, so ordinary request
# logs and Keycloak's own unsanitized broker body lines stay out of the file.
# Social IdP failures are WARN on com.mesutpiskin.keycloak.auth.email.ds.idp.
# Server-problem *_ERROR events are ERROR on
# com.mesutpiskin.keycloak.auth.email.ds.errors.

quarkus.log.handler.file."ds-errors".enabled=true
quarkus.log.handler.file."ds-errors".path=/var/log/ds-errors/keycloak.errors.log
quarkus.log.handler.file."ds-errors".level=WARN
quarkus.log.handler.file."ds-errors".json.enabled=true
quarkus.log.handler.file."ds-errors".rotation.enabled=true
quarkus.log.handler.file."ds-errors".rotation.max-file-size=10M
quarkus.log.handler.file."ds-errors".rotation.max-backup-index=5
quarkus.log.handler.file."ds-errors".rotation.rotate-on-boot=false

quarkus.log.category."com.mesutpiskin.keycloak.auth.email.ds.idp".level=WARN
quarkus.log.category."com.mesutpiskin.keycloak.auth.email.ds.idp".handlers=ds-errors
quarkus.log.category."com.mesutpiskin.keycloak.auth.email.ds.idp".use-parent-handlers=true

quarkus.log.category."com.mesutpiskin.keycloak.auth.email.ds.errors".level=ERROR
quarkus.log.category."com.mesutpiskin.keycloak.auth.email.ds.errors".handlers=ds-errors
quarkus.log.category."com.mesutpiskin.keycloak.auth.email.ds.errors".use-parent-handlers=true
