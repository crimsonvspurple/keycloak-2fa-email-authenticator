parent=keycloak.v2
import=common/keycloak

styles=css/ds.css
# Replaced with the git sha when the image is built. Templates append it to
# resource URLs. The Keycloak resource tag does not change when only this
# theme changes, and Cloudflare keeps those URLs for four hours.
dsVersion=__DS_THEME_REV__
meta=viewport==width=device-width,initial-scale=1

# This theme draws its own light and dark switch. Leave Keycloak's
# PatternFly dark-mode script off so the two do not fight.
darkMode=false
